<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login</title>
  <link rel="stylesheet" href="login.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Montserrat:600,400&display=swap">
  <script src="https://kit.fontawesome.com/8d9397bc8a.js" crossorigin="anonymous"></script>
</head>
<body>
  <div class="login-box">
    <h2>Login</h2>
   
      <form onsubmit="loginUser(event)">
      <div class="input-group">
        <input type="text" placeholder="Username" required>
        <span class="icon">
          <i class="fa fa-user"></i>
        </span>
      </div>
      <div class="input-group">
        <input type="password" placeholder="Password" required>
        <span class="icon">
          <i class="fa fa-lock"></i>
        </span>
      </div>
      <div class="options-row">
        <label>
          <input type="checkbox"> Remember me
        </label>
        <a href="#">Forgot password?</a>
      </div>
      <!-- <button class="login-btn" type="submit">Login</button> -->
       <button class="login-btn" type="button" onclick="window.location.href='course.html'" >
  Login
</button>

    </form>
    <div class="register-link">
      You  have already account? <a href="login.html">Login</a>
    </div>
  </div>




  <script>
async function loginUser(event) {
  event.preventDefault();

  const email = document.querySelector("input[placeholder='Username']").value;
  const password = document.querySelector("input[placeholder='Password']").value;

  const res = await fetch("http://localhost:5000/api/auth/login", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ email, password })
  });

  const result = await res.json();

  if (result.error) {
    alert(result.error);
  } else {
    localStorage.setItem("token", result.token);
    window.location.href = "profile.html";
  }
}
</script>
</body>
</html>
