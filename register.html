<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Register</title>
  <link rel="stylesheet" href="register.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Montserrat:600,400&display=swap">
  <script src="https://kit.fontawesome.com/8d9397bc8a.js" crossorigin="anonymous"></script>
</head>
<body>

  <div class="register-box">
    <h2>Create Account</h2>

    <form action="course.html" onsubmit="registerUser(event)">
      
      <!-- Username -->
      <div class="input-group">
        <input type="text" placeholder="Username" required>
        <span class="icon">
          <i class="fa fa-user"></i>
        </span>
      </div>

      <!-- Email -->
      <div class="input-group">
        <input type="email" placeholder="Email" required>
        <span class="icon">
          <i class="fa fa-envelope"></i>
        </span>
      </div>

      <!-- Password -->
      <div class="input-group">
        <input type="password" placeholder="Password" required>
        <span class="icon">
          <i class="fa fa-lock"></i>
        </span>
      </div>

      <!-- Confirm Password -->
      <div class="input-group">
        <input type="password" placeholder="Confirm Password" required>
        <span class="icon">
          <i class="fa fa-lock"></i>
        </span>
      </div>

      <button type="submit" class="register-btn">Register</button>
    </form>

    <div class="login-link">
      Already have an account? <a href="login.html">Login</a>
    </div>
  </div>

  <script>
async function registerUser(e) {
  e.preventDefault();

  const username = document.querySelector("input[placeholder='Username']").value;
  const email = document.querySelector("input[placeholder='Email']").value;
  //  const phone = document.querySelector("input[placeholder='Number']").value;
  const password = document.querySelector("input[placeholder='Password']").value;

  const res = await fetch("http://localhost:5000/api/auth/register", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ username, email, password })
  });

  const data = await res.json();

  if (data.error) {
    alert(data.error);
  } else {
    alert("Registered Successfully!");
    window.location.href = "course.html";
  }
}
</script>


</body>
</html>
